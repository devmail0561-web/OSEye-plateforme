name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.25"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test-go:
    name: Test Go
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download modules
        working-directory: agent
        run: go mod download

      - name: Build
        working-directory: agent
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        working-directory: agent
        run: CGO_ENABLED=0 go test ./...

  lint-go:
    name: Lint Go
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download modules
        working-directory: agent
        run: go mod download

      - name: go vet
        working-directory: agent
        run: CGO_ENABLED=0 go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: agent

  test-python:
    name: Test Python
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        working-directory: server
        run: |
          pip install -e "../sdk"
          pip install -e ".[dev]"

      - name: Test (SQLite + in-memory bus)
        working-directory: server
        env:
          # No postgres/redis — tests use SQLite + MemoryBus by default
          OSEYE_CHECKPOINT_HMAC_KEY: ci-test-key
          OSEYE_INSECURE: "true"
          # Force dev defaults so tests that hardcode admin123/analyst123 pass.
          # bcrypt truncation fix in auth.py prevents 72-byte crash on long sys passwords.
          OSEYE_ADMIN_PASSWORD: admin123
          OSEYE_ANALYST_PASSWORD: analyst123
        run: pytest tests/unit/ tests/scenarios/ -q

  test-typescript:
    name: Test TypeScript
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Test
        working-directory: ui
        run: npm test

  build-agent:
    name: Build Agent linux/${{ matrix.arch }}
    runs-on: self-hosted
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download modules
        working-directory: agent
        run: go mod download

      - name: Build
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -o /dev/null ./cmd/oseye-agent
