name: CI — Lint, Test, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.23"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ================================================================
  # LINT
  # ================================================================

  lint-go:
    name: Lint — Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: agent
          args: --timeout 5m

  lint-python:
    name: Lint — Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: server
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        working-directory: server
        run: ruff check .

      - name: Mypy
        working-directory: server
        run: mypy oseye/ --strict

  lint-typescript:
    name: Lint — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check UI initialised
        id: ui_check
        run: |
          if [ -f ui/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.ui_check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: steps.ui_check.outputs.exists == 'true'
        working-directory: ui
        run: npm ci

      - name: ESLint
        if: steps.ui_check.outputs.exists == 'true'
        working-directory: ui
        run: npm run lint

  # ================================================================
  # TESTS
  # ================================================================

  test-go:
    name: Test — Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        working-directory: agent
        shell: bash
        run: |
          go test -race -cover -coverprofile=coverage.out \
            $(go list ./... | grep -v '/platform/linux/ebpf')

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./agent/coverage.out
          flags: agent

  test-python:
    name: Test — Python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oseye_test
          POSTGRES_USER: oseye
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: server
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: server
        env:
          OSEYE_DB_URL: postgresql+asyncpg://oseye:test@localhost:5432/oseye_test
          OSEYE_BUS_REDIS_URL: redis://localhost:6379
          OSEYE_CHECKPOINT_HMAC_KEY: ci-test-hmac-key-not-for-production
          OSEYE_INSECURE: "true"
        run: pytest --cov=oseye --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage.xml
          flags: server

  test-typescript:
    name: Test — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check UI initialised
        id: ui_check
        run: |
          if [ -f ui/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.ui_check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: steps.ui_check.outputs.exists == 'true'
        working-directory: ui
        run: npm ci

      - name: Run tests
        if: steps.ui_check.outputs.exists == 'true'
        working-directory: ui
        run: npm test

      - name: Upload coverage
        if: steps.ui_check.outputs.exists == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: ./ui/coverage/lcov.info
          flags: ui

  # ================================================================
  # BUILD
  # ================================================================

  build-agent:
    name: Build — Agent (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        working-directory: agent
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -o oseye-agent-${{ matrix.os }}-${{ matrix.arch }} ./cmd/oseye-agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.os }}-${{ matrix.arch }}
          path: agent/oseye-agent-${{ matrix.os }}-${{ matrix.arch }}

  build-docker:
    name: Build — Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          platforms: linux/amd64,linux/arm64
          push: false
          tags: oseye-agent:ci

      - name: Build server image
        if: hashFiles('server/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: oseye-server:ci

      - name: Build UI image
        if: hashFiles('ui/package.json') != ''
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: false
          tags: oseye-ui:ci

  # ================================================================
  # SECURITY
  # ================================================================

  audit-security:
    name: Audit — Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Go vulnerability check
        working-directory: agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Python dependency audit
        working-directory: server
        run: |
          pip install pip-audit
          pip-audit --requirement <(pip freeze) || true

  # ================================================================
  # STATUS CHECK
  # ================================================================

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - lint-go
      - lint-python
      - lint-typescript
      - test-go
      - test-python
      - test-typescript
      - build-agent
      - build-docker
    steps:
      - run: echo "All required CI checks passed!"
