name: CI — Lint, Test, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

env:
  GO_VERSION: "1.23"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test-go:
    name: Test — Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        working-directory: agent
        shell: bash
        run: |
          CGO_ENABLED=0 go test -count=1 \
            $(go list ./... | grep -v '/platform/linux/ebpf')

  test-python:
    name: Test — Python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oseye_test
          POSTGRES_USER: oseye
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        working-directory: server
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: server
        env:
          OSEYE_DB_URL: postgresql+asyncpg://oseye:test@localhost:5432/oseye_test
          OSEYE_BUS_REDIS_URL: redis://localhost:6379
          OSEYE_CHECKPOINT_HMAC_KEY: ci-test-key
          OSEYE_INSECURE: "true"
        run: pytest tests/unit/ tests/scenarios/ -q

  test-typescript:
    name: Test — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Run tests
        working-directory: ui
        run: npm test

  lint-go:
    name: Lint — Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go vet
        working-directory: agent
        run: CGO_ENABLED=0 go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: agent
          args: --timeout 5m

  build-agent:
    name: Build — Agent (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        working-directory: agent
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -o /dev/null ./cmd/oseye-agent

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test-go
      - test-python
      - test-typescript
      - lint-go
      - build-agent
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed"
