name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  AGENT_IMAGE: ${{ github.repository }}/oseye-agent
  SERVER_IMAGE: ${{ github.repository }}/oseye-server

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Go vet
        run: cd agent && go vet ./...
      - name: Go tests
        shell: bash
        run: |
          cd agent && go test -race -count=1 \
            $(go list ./... | grep -v '/platform/linux/ebpf')

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist/${{ matrix.arch }}
          cd agent
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o ../dist/${{ matrix.arch }}/oseye-agent \
            ./cmd/oseye-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o ../dist/${{ matrix.arch }}/oseye-config \
            ./cmd/oseye-config
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/

  build-server-binary:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install pyinstaller uv
          cd server && uv pip install --system -e .
      - name: Build server binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          pyinstaller server/oseye/main.py \
            --onefile \
            --name oseye-server \
            --distpath dist/ \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp/pyinstaller-spec \
            --add-data "server/oseye/policy/profiles:oseye/policy/profiles" \
            --add-data "rules:rules" \
            --hidden-import oseye \
            --hidden-import grpc \
            --hidden-import aiosqlite \
            --hidden-import asyncpg \
            --hidden-import sqlalchemy.dialects.sqlite \
            --hidden-import sqlalchemy.dialects.postgresql.asyncpg \
            --hidden-import sqlalchemy.ext.asyncio \
            --hidden-import passlib.handlers.bcrypt \
            --exclude-module sklearn \
            --exclude-module skimage \
            --exclude-module matplotlib \
            --exclude-module grpc_tools \
            --exclude-module IPython \
            --exclude-module ipykernel \
            --exclude-module notebook \
            --exclude-module pandas \
            --exclude-module pytest \
            --noconfirm \
            --clean
      - uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: dist/oseye-server

  package:
    needs: [build, build-server-binary]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/
      - name: Install nfpm
        run: |
          NFPM_ARCH=$(dpkg --print-architecture 2>/dev/null || echo amd64)
          curl -sfL "https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_linux_${NFPM_ARCH}.tar.gz" | tar xz -C /usr/local/bin nfpm
      - uses: actions/download-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: server-binary
          path: dist/
      - name: Package agent .deb and .rpm
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${VERSION#v}"
          chmod +x dist/oseye-agent dist/oseye-config
          VERSION=$VERSION ARCH=$ARCH nfpm package --config packaging/nfpm-agent.yaml --target dist/ --packager deb
          VERSION=$VERSION ARCH=$ARCH nfpm package --config packaging/nfpm-agent.yaml --target dist/ --packager rpm
          # Tarballs agent
          tar czf "dist/oseye-agent-linux-${ARCH}-${VERSION}.tar.gz" -C dist oseye-agent oseye-config
      - name: Package server .deb and .rpm
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${VERSION#v}"
          chmod +x dist/oseye-server
          VERSION=$VERSION ARCH=$ARCH nfpm package --config packaging/nfpm-server.yaml --target dist/ --packager deb
          VERSION=$VERSION ARCH=$ARCH nfpm package --config packaging/nfpm-server.yaml --target dist/ --packager rpm
          tar czf "dist/oseye-server-linux-amd64-${VERSION}.tar.gz" -C dist oseye-server
      - name: Sign packages (GPG)
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for pkg in dist/*.deb dist/*.rpm; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$pkg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.asc

  docker-agent:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE }}:${{ github.ref_name }}
      - name: Sign with cosign
        if: env.COSIGN_KEY != ''
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          cosign sign --key env://COSIGN_KEY \
            ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE }}:${{ github.ref_name }}

  docker-server:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}:${{ github.ref_name }}
      - name: Sign with cosign
        if: env.COSIGN_KEY != ''
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          cosign sign --key env://COSIGN_KEY \
            ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}:${{ github.ref_name }}

  docker-ui:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/oseye-ui:${{ github.ref_name }}

  release:
    needs: [package, docker-agent, docker-server, docker-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.deb *.rpm *.tar.gz 2>/dev/null > SHA256SUMS || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.tar.gz
            artifacts/*.asc
            artifacts/SHA256SUMS
