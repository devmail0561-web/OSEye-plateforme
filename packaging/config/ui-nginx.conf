# OSEye UI — nginx configuration
# Installed at /etc/oseye/ui-nginx.conf by oseye-ui package.
# Edit OSEYE_SERVER_URL below to point to your OSEye server.
# Then: sudo systemctl restart oseye-ui

# ── CONFIGURATION ─────────────────────────────────────────────────────────────
# URL du serveur OSEye (API + WebSocket)
# Exemples:
#   http://localhost:8000        (serveur local, même machine)
#   https://oseye.example.com    (serveur distant avec TLS)
#   http://192.168.1.10:8000     (serveur sur le réseau local)
#
# À changer dans ce fichier, puis redémarrer : sudo systemctl restart oseye-ui
# ──────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 512;
}

pid /run/nginx-oseye-ui.pid;

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

    # Logs
    access_log /var/log/oseye/ui-access.log;
    error_log  /var/log/oseye/ui-error.log;

    server {
        listen       5173;
        server_name  _;
        root         /usr/share/oseye/ui;
        index        index.html;

        # ── Proxy API vers le serveur OSEye ───────────────────────────────────
        # Changer http://localhost:8000 par l'adresse de votre serveur OSEye
        location /api/ {
            proxy_pass http://localhost:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Proxy WebSocket ───────────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://localhost:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
        }

        # ── SPA fallback ──────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options          "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options   "nosniff"                      always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

        # ── Cache assets statiques ────────────────────────────────────────────
        location ~* \.(js|css|woff2|svg|png|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
