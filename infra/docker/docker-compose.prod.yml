name: oseye-prod

# Déploiement production — HTTPS, Docker secrets, réseaux isolés.
#
# Prérequis (une seule fois sur l'hôte) :
#   1. Générer les secrets :
#        mkdir -p /etc/oseye/secrets
#        openssl rand -hex 16 > /etc/oseye/secrets/secret_key.txt
#        openssl rand -hex 32 > /etc/oseye/secrets/hmac_key.txt
#        openssl rand -base64 24 > /etc/oseye/secrets/admin_password.txt
#        openssl rand -base64 24 > /etc/oseye/secrets/analyst_password.txt
#        openssl rand -base64 24 > /etc/oseye/secrets/db_password.txt
#
#   2. Initialiser les certificats et tokens d'enrollment :
#        docker run --rm -v /etc/oseye:/etc/oseye \
#          oseye-server:0.2.0-alpha.1 oseye-server init
#
#   3. (Optionnel) Personnaliser /etc/oseye/server.env
#
# Lancement :
#   docker compose -f infra/docker/docker-compose.prod.yml up -d
#
# L'UI est accessible sur https://<VOTRE_DOMAINE>
# Le gRPC est sur <VOTRE_DOMAINE>:50051 (mTLS)

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oseye
      POSTGRES_USER: oseye
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oseye"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - oseye-backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --save 60 1
        --appendonly yes
        --requirepass-file /run/secrets/redis_password
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oseye-backend

  oseye-server:
    image: oseye-server:0.2.0-alpha.1
    restart: unless-stopped
    environment:
      OSEYE_DB_BACKEND: postgresql
      OSEYE_API_HOST: 0.0.0.0
      OSEYE_API_PORT: "8000"
      # CORS : lister les origines autorisées (domaine réel en prod)
      OSEYE_API_CORS_ORIGINS: '["https://oseye.example.com"]'
      OSEYE_GRPC_PORT: "50051"
      OSEYE_GRPC_INSECURE_DEV: "false"
      OSEYE_TLS_CERT_FILE: /etc/oseye/certs/server.crt
      OSEYE_TLS_KEY_FILE: /etc/oseye/certs/server.key
      OSEYE_TLS_CA_CERT_FILE: /etc/oseye/certs/ca.crt
      OSEYE_TLS_CA_KEY_FILE: /etc/oseye/certs/ca.key
      OSEYE_AGENT_KEYS_DIR: /etc/oseye/agent_keys
      OSEYE_JWT_PRIVATE_KEY_PATH: /etc/oseye/certs/jwt_private.pem
      OSEYE_JWT_PUBLIC_KEY_PATH: /etc/oseye/certs/jwt_public.pem
      OSEYE_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      OSEYE_DATA_DIR: /var/lib/oseye
      OSEYE_PLUGINS_DIR: /var/lib/oseye/plugins
      OSEYE_PLUGIN_REQUIRE_SIGNATURE: "true"
      OSEYE_LOG_LEVEL: info
      OSEYE_ENV: production
      # Management API — activer pour permettre l'accès via UI ou API clients.
      # L'UI peut être hébergée n'importe où (CDN, container séparé, même serveur).
      OSEYE_MANAGEMENT_API_ENABLED: "true"
      # UI intégrée sur ce serveur (optionnel — monter ui/dist dans /app/ui-dist)
      # OSEYE_UI_DIR: /app/ui-dist
      # Secrets lus depuis les fichiers Docker secrets par l'entrypoint
      OSEYE_SECRET_KEY_FILE: /run/secrets/secret_key
      OSEYE_CHECKPOINT_HMAC_KEY_FILE: /run/secrets/hmac_key
      OSEYE_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      OSEYE_ANALYST_PASSWORD_FILE: /run/secrets/analyst_password
      OSEYE_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      OSEYE_DB_PASSWORD_FILE: /run/secrets/db_password
    entrypoint: ["/entrypoint.sh"]
    secrets:
      - db_password
      - redis_password
      - secret_key
      - hmac_key
      - admin_password
      - analyst_password
    env_file:
      - path: /etc/oseye/server.env
        required: false   # optionnel — surcharge les variables ci-dessus
    volumes:
      - /etc/oseye/certs:/etc/oseye/certs:ro
      - /etc/oseye/agent_keys:/etc/oseye/agent_keys:ro
      - /etc/oseye/enrollment_tokens:/etc/oseye/enrollment_tokens
      - oseye_data:/var/lib/oseye
    ports:
      - "50051:50051"   # gRPC mTLS — exposé pour les agents
      # Port 8000 (API) non exposé : uniquement joignable par nginx via oseye-proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - oseye-backend   # accès postgres + redis
      - oseye-proxy     # accès par nginx uniquement

  # oseye-ui est supprimé : l'UI est servie directement par oseye-server
  # (configurer OSEYE_UI_DIR=/app/ui-dist après make ui-build).
  # Pour une UI dans un container séparé, décommenter et adapter.

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"     # redirige vers 443
      - "443:443"   # HTTPS — seul point d'entrée public
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/oseye/certs:/etc/nginx/certs:ro
    depends_on:
      - oseye-server
    networks:
      - oseye-proxy     # joindre oseye-server:8000

volumes:
  postgres_data:
  redis_data:
  oseye_data:

secrets:
  db_password:
    file: /etc/oseye/secrets/db_password.txt
  redis_password:
    file: /etc/oseye/secrets/redis_password.txt
  secret_key:
    file: /etc/oseye/secrets/secret_key.txt
  hmac_key:
    file: /etc/oseye/secrets/hmac_key.txt
  admin_password:
    file: /etc/oseye/secrets/admin_password.txt
  analyst_password:
    file: /etc/oseye/secrets/analyst_password.txt

networks:
  oseye-backend:
    driver: bridge
    internal: true    # postgres + redis : pas d'accès internet, pas de port exposé
  oseye-proxy:
    driver: bridge
    internal: true    # oseye-server:8000 : joignable par nginx uniquement
