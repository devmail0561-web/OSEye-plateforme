name: desktop
description: "Desktop monitoring — fixed workstation"
version: 1
platforms: [linux, windows]
collectors:
  procfs: {enabled: true, throttle: 1.0}
  auditd: {enabled: true, throttle: 1.0}
  fanotify: {enabled: false}
  netlink: {enabled: true, throttle: 2.0}
  journald: {enabled: false}
min_severity: low
push_interval_s: 60
ignore_processes:
  - oseye-agent
  - oseye-config
ignore_paths_prefix:
  - /etc/oseye/
  - /var/lib/oseye/
  - /tmp/oseye
baseline_apps:
  - systemd
  - sshd
  - cron
  - bash
  - sh
  - python3
  - apt
  - apt-get
  - dpkg
  - NetworkManager
  - wpa_supplicant
  - dhclient
  - journald
  - rsyslog
  - dbus-daemon
  - polkitd
  - gnome-shell
baseline_users:
  - root
