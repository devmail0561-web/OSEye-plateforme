name: dns
description: "DNS server monitoring (bind, unbound)"
version: 1
platforms: [linux]
collectors:
  procfs: {enabled: true, throttle: 0.5}
  auditd: {enabled: true, throttle: 0.5}
  fanotify: {enabled: true, throttle: 1.0}
  inotify: {enabled: true, throttle: 1.0}
  netlink: {enabled: true, throttle: 0.5}
  journald: {enabled: true, throttle: 1.0}
  syslog: {enabled: true, throttle: 1.0}
min_severity: info
push_interval_s: 30
ignore_processes:
  - oseye-agent
  - oseye-config
ignore_paths_prefix:
  - /etc/oseye/
  - /var/lib/oseye/
  - /tmp/oseye
  - /var/lib/bind/
  - /var/cache/bind/
  - /etc/bind/
  - /etc/unbound/
baseline_apps:
  - systemd
  - named
  - unbound
  - bind9
  - dig
  - nslookup
  - sshd
  - cron
  - rsyslog
baseline_users:
  - root
  - bind
  - named
  - unbound
