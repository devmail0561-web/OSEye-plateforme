name: compliance
description: "Regulatory compliance — full audit trail"
version: 1
platforms: [linux, windows]
collectors:
  auditd: {enabled: true, throttle: 0.5}
  fanotify: {enabled: true, throttle: 1.0}
  journald: {enabled: true, throttle: 0.5}
  procfs: {enabled: true, throttle: 1.0}
min_severity: info
push_interval_s: 60
ignore_processes:
  - oseye-agent
  - oseye-config
ignore_paths_prefix:
  - /etc/oseye/
  - /var/lib/oseye/
  - /tmp/oseye
baseline_apps:
  - systemd
  - sshd
  - auditd
  - rsyslog
  - cron
  - bash
  - sh
baseline_users:
  - root
