name: compliance
description: "Regulatory compliance — full audit trail"
version: 1
platforms: [linux, windows]
collectors:
  auditd: {enabled: true, throttle: 0.5}
  fanotify: {enabled: true, throttle: 1.0}
  journald: {enabled: true, throttle: 0.5}
  procfs: {enabled: true, throttle: 1.0}
min_severity: info
push_interval_s: 60
