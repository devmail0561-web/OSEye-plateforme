name: minimal
description: "Minimal footprint for IoT or low-resource hosts"
version: 1
platforms: [linux]
collectors:
  procfs: {enabled: true, throttle: 5.0}
  netlink: {enabled: false}
  auditd: {enabled: false}
min_severity: high
push_interval_s: 300
ignore_processes:
  - oseye-agent
  - oseye-config
ignore_paths_prefix:
  - /etc/oseye/
  - /var/lib/oseye/
  - /tmp/oseye
baseline_apps:
  - systemd
  - sshd
baseline_users:
  - root
