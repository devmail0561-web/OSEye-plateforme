name: webserver
description: "Web server monitoring (nginx, apache, node)"
version: 1
platforms: [linux]
collectors:
  procfs: {enabled: true, throttle: 0.5}
  auditd: {enabled: true, throttle: 0.5}
  fanotify: {enabled: true, throttle: 1.0}
  inotify: {enabled: true, throttle: 1.0}
  netlink: {enabled: true, throttle: 0.5}
  journald: {enabled: true, throttle: 1.0}
  syslog: {enabled: true, throttle: 1.0}
min_severity: info
push_interval_s: 30
ignore_processes:
  - oseye-agent
  - oseye-config
ignore_paths_prefix:
  - /etc/oseye/
  - /var/lib/oseye/
  - /tmp/oseye
  - /var/log/nginx/
  - /var/log/apache2/
baseline_apps:
  - systemd
  - nginx
  - apache2
  - httpd
  - node
  - php-fpm
  - python3
  - sshd
  - cron
  - rsyslog
  - dbus-daemon
baseline_users:
  - root
  - www-data
  - nginx
  - apache
