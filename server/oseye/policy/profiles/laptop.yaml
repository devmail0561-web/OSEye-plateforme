name: laptop
description: "Laptop monitoring — mobile workstation with VPN and wifi"
version: 1
platforms: [linux, darwin, windows]
collectors:
  procfs: {enabled: true, throttle: 1.0}
  auditd: {enabled: true, throttle: 1.0}
  fanotify: {enabled: false}
  netlink: {enabled: true, throttle: 2.0}
  journald: {enabled: false}
min_severity: low
push_interval_s: 60
ignore_processes:
  - oseye-agent
  - oseye-config
ignore_paths_prefix:
  - /etc/oseye/
  - /var/lib/oseye/
  - /tmp/oseye
  - /run/NetworkManager/
baseline_apps:
  - systemd
  - sshd
  - cron
  - bash
  - sh
  - python3
  - apt
  - apt-get
  - dpkg
  - NetworkManager
  - wpa_supplicant
  - dhclient
  - vpnc
  - openvpn
  - openconnect
  - journald
  - rsyslog
  - dbus-daemon
  - polkitd
  - gnome-shell
  - gnome-keyring-daemon
baseline_users:
  - root
