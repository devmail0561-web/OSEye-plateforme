- id: rule_shadow_read
  name: "Lecture de /etc/shadow hors root"
  # YAML-003: disabled — event.uid is not emitted by fanotify/inotify.
  # Requires eBPF collector to have the uid field populated.
  # Re-enable only when event.collector == "ebpf" is guaranteed.
  enabled: false
  severity: critical
  tags: [credential_access, os_credential_dumping]
  mitre: [T1003.008]
  platforms: [linux]
  requires: [ebpf]
  condition: |
    event.category == "file"
    and (event.type == "open" or event.type == "access")
    and event.resource == "/etc/shadow"
    and event.uid != 0
  timeframe: null
  threshold: null
  actions: [ALERT, INVESTIGATE]
  explanation: >
    Tentative de lecture du fichier /etc/shadow par un processus non-root.
    Indique un vol de credentials probable (hash cracking offline).
    NOTE: la condition event.uid != 0 nécessite le collecteur eBPF (fanotify/inotify
    n'émettent pas ce champ).

- id: rule_passwd_write
  name: "Écriture dans /etc/passwd ou /etc/shadow"
  enabled: true
  severity: critical
  tags: [credential_access, account_manipulation]
  mitre: [T1098, T1003.008]
  platforms: [linux]
  condition: |
    event.category == "file"
    and (event.type == "modify" or event.type == "close_write")
    and (event.resource == "/etc/passwd" or event.resource == "/etc/shadow")
  timeframe: null
  threshold: null
  actions: [ALERT, INVESTIGATE]
  explanation: >
    Modification des fichiers de credentials système.
    Peut indiquer l'ajout d'un compte backdoor ou la manipulation de mots de passe.

- id: rule_ssh_private_key_access
  name: "Accès à une clé privée SSH hors propriétaire"
  # YAML-004: disabled — les exclusions process_name sont inefficaces pour fanotify.
  # fanotify n'émet pas le champ process_name ; les exclusions ne fonctionneront jamais.
  # Nécessite le collecteur eBPF pour avoir process_name disponible.
  enabled: false
  severity: high
  tags: [credential_access, ssh_key_theft]
  mitre: [T1552.004]
  platforms: [linux, darwin]
  requires: [ebpf]
  condition: |
    event.category == "file"
    and (event.type == "open" or event.type == "access")
    and (event.resource contains "id_rsa" or event.resource contains "id_ed25519" or event.resource contains "id_ecdsa")
    and event.uid != 0
    and event.process_name != "ssh"
    and event.process_name != "ssh-agent"
    and event.process_name != "git"
  timeframe: null
  threshold: null
  actions: [ALERT]
  explanation: >
    Lecture d'une clé privée SSH. Si le processus n'est pas le propriétaire légitime
    de la clé, cela peut indiquer une tentative de vol de credentials SSH.
    NOTE: nécessite eBPF — fanotify n'émet pas process_name ni uid.

- id: rule_memory_dump_mimipenguin
  name: "Outil de dump mémoire credentials (Linux)"
  enabled: true
  severity: critical
  tags: [credential_access, os_credential_dumping]
  mitre: [T1003.007]
  platforms: [linux]
  condition: |
    event.category == "process"
    and (event.executable contains "mimipenguin" or event.executable contains "lazagne"
         or event.cmdline contains "mimipenguin" or event.cmdline contains "/proc/kcore")
  timeframe: null
  threshold: null
  actions: [ALERT, INVESTIGATE]
  explanation: >
    Détection d'un outil de dump credentials en mémoire sur Linux (mimipenguin, lazagne).
    Compromission de credentials imminente.

- id: rule_ssh_bruteforce
  name: "Brute-force SSH (>10 tentatives/60s)"
  enabled: true
  severity: high
  tags: [credential_access, brute_force]
  mitre: [T1110.001]
  platforms: [linux]
  # YAML-002: entity_key doit utiliser hostname:src_ip pour les événements réseau
  # car les événements netlink ont pid=0 (hostname:pid serait toujours le même bucket).
  # La clé hostname:src_ip est calculée par l'évaluateur quand entity_key est spécifié.
  entity_key: "hostname:src_ip"
  condition: |
    event.category == "network"
    and event.protocol == "tcp"
    and event.dst_port == 22
    and event.type == "new"
  timeframe: 60
  threshold: 10
  actions: [ALERT]
  explanation: >
    Plus de 10 connexions TCP new vers le port SSH (22) en 60 secondes depuis la même source.
    Pattern typique d'une attaque brute-force SSH.
    NOTE (YAML-001): la condition event.result == "denied" a été supprimée car ce champ
    n'est jamais émis par netlink. La règle compte maintenant les connexions TCP new
    indépendamment du résultat. NOTE (YAML-002): entity_key utilise hostname:src_ip
    car les événements réseau netlink ont pid=0.
