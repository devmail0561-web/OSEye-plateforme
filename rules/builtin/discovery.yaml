- id: rule_recon_enumeration
  name: "Énumération système (whoami, id, uname en rafale)"
  enabled: true
  severity: low
  tags: [discovery, system_info]
  mitre: [T1082, T1033]
  platforms: [linux]
  condition: |
    event.category == "process"
    and (event.process_name == "whoami" or event.process_name == "id"
         or event.process_name == "uname" or event.process_name == "hostname"
         or event.process_name == "uptime")
    and event.uid != 0
  timeframe: 30
  threshold: 5
  entity_key: "hostname:uid"
  actions: [ALERT]
  explanation: >
    Plusieurs commandes d'énumération système en 30 secondes.
    Pattern typique post-exploitation pour cartographier l'environnement.

- id: rule_network_discovery
  name: "Découverte réseau (netstat, ss, arp)"
  enabled: true
  severity: low
  tags: [discovery, network_discovery]
  mitre: [T1049]
  platforms: [linux]
  condition: |
    event.category == "process"
    and (event.process_name == "netstat" or event.process_name == "ss"
         or event.process_name == "arp" or event.cmdline contains "ip route"
         or event.cmdline contains "ip neigh")
    and event.uid != 0
  timeframe: 10
  threshold: 3
  entity_key: "hostname:uid"
  actions: [ALERT]
  explanation: >
    Exécution de commandes de découverte réseau en rafale.
    Indique une cartographie réseau post-compromission.

- id: rule_process_discovery
  name: "Énumération des processus (ps aux, /proc scan)"
  enabled: true
  severity: info
  tags: [discovery, process_discovery]
  mitre: [T1057]
  platforms: [linux]
  condition: |
    event.category == "process"
    and event.process_name == "ps"
    and (event.cmdline contains "aux" or event.cmdline contains "-ef")
    and event.uid != 0
  timeframe: 30
  threshold: 10
  entity_key: "hostname:uid"
  actions: [ALERT]
  explanation: >
    10+ exécutions de ps aux/ps -ef en 30 secondes par un utilisateur non-root.
    Souvent utilisé pour trouver des cibles d'injection ou des processus privilégiés.

- id: rule_sensitive_file_discovery
  name: "Accès à des fichiers de configuration sensibles"
  enabled: true
  severity: medium
  tags: [discovery, credentials_in_files]
  mitre: [T1552.001]
  platforms: [linux]
  condition: |
    event.category == "file"
    and (event.type == "open" or event.type == "access")
    and (event.resource contains "/.aws/credentials" or event.resource contains "/.env"
         or event.resource contains "/etc/kubernetes" or event.resource contains "kubeconfig"
         or event.resource contains "docker-compose.yml" or event.resource contains ".npmrc"
         or event.resource contains ".pypirc")
    # R-02 : uid != 0 supprimé — fanotify/inotify ne peuplent pas le champ uid
    # (défaut Pydantic = 0), donc le filtre bloquerait toutes les alertes.
    # Les accès root à des fichiers de credentials sont également suspects.
  timeframe: null
  threshold: null
  actions: [ALERT]
  explanation: >
    Accès à des fichiers contenant potentiellement des credentials (AWS, Kubernetes,
    variables d'environnement, registres de packages). Le filtre uid != 0 a été
    supprimé car fanotify/inotify n'émettent pas ce champ (uid vaut toujours 0
    par défaut Pydantic) — les accès root sont aussi signalés.

- id: rule_sudo_discovery
  name: "Énumération des droits sudo"
  enabled: true
  severity: low
  # RULE-012: tag corrigé — T1069.001 est "Permission Groups Discovery: Local Groups",
  # pas "Privilege Escalation". Tag corrigé en [discovery].
  # Threshold ajouté : une seule exécution de sudo -l est souvent légitime.
  tags: [discovery, permission_groups_discovery]
  mitre: [T1069.001]
  platforms: [linux]
  condition: |
    event.category == "process"
    and event.process_name == "sudo"
    and event.cmdline contains "-l"
    and event.uid != 0
  timeframe: 60
  threshold: 3
  entity_key: "hostname:uid"
  actions: [ALERT]
  explanation: >
    3+ exécutions de sudo -l en 60 secondes par un utilisateur non-root.
    Étape de reconnaissance précédant souvent une tentative d'escalade de privilèges.
