- id: rule_log_deletion
  name: "Suppression de fichiers de logs système"
  enabled: true
  severity: high
  tags: [defense_evasion, indicator_removal]
  mitre: [T1070.002]
  platforms: [linux]
  condition: |
    event.category == "file"
    and event.type == "delete"
    and (event.resource contains "/var/log/" or event.resource contains "/var/log/auth"
         or event.resource contains "/var/log/syslog" or event.resource contains "/var/log/messages")
  timeframe: null
  threshold: null
  actions: [ALERT, INVESTIGATE]
  explanation: >
    Suppression de fichiers de logs système. Technique d'effacement des traces
    après une intrusion (Indicator Removal on Host).

- id: rule_history_clear
  name: "Effacement de l'historique shell"
  enabled: true
  severity: medium
  tags: [defense_evasion, clear_command_history]
  mitre: [T1070.003]
  platforms: [linux, darwin]
  condition: |
    (event.category == "file" and event.type == "delete" and event.resource contains ".bash_history")
    or (event.category == "process" and (event.cmdline contains "history -c" or event.cmdline contains "HISTFILE=/dev/null"
         or event.cmdline contains "unset HISTFILE" or event.cmdline contains "HISTSIZE=0"))
  timeframe: null
  threshold: null
  actions: [ALERT]
  explanation: >
    Effacement de l'historique de commandes shell.
    Technique courante pour masquer les commandes exécutées lors d'une intrusion.

- id: rule_timestomp
  name: "Manipulation des horodatages de fichiers (timestomping)"
  enabled: true
  severity: medium
  tags: [defense_evasion, timestomp]
  mitre: [T1070.006]
  platforms: [linux]
  condition: |
    event.category == "process"
    and (event.process_name == "touch" or event.cmdline contains "touch -t"
         or event.cmdline contains "touch -d")
    and event.uid != 0
  timeframe: null
  threshold: null
  actions: [ALERT]
  explanation: >
    Modification des timestamps de fichiers via touch.
    Permet de masquer les indicateurs de compromission en altérant les dates.

- id: rule_disable_selinux_apparmor
  name: "Désactivation de SELinux ou AppArmor"
  enabled: true
  severity: critical
  tags: [defense_evasion, impair_defenses]
  mitre: [T1562.001]
  platforms: [linux]
  # RULE-007: split into two separate conditions — process commands and file writes —
  # so that both category=="process" and category=="file" cases are handled correctly
  # without mixing categories in a single AND chain.
  condition: |
    (event.category == "process"
     and (event.cmdline contains "setenforce 0"
          or event.cmdline contains "aa-teardown"
          or event.cmdline contains "systemctl disable apparmor"
          or event.cmdline contains "systemctl stop apparmor"))
    or (event.category == "file"
        and (event.type == "modify" or event.type == "close_write")
        and event.resource contains "/etc/selinux/config")
  timeframe: null
  threshold: null
  actions: [ALERT, INVESTIGATE]
  explanation: >
    Tentative de désactivation du module de sécurité Linux (SELinux/AppArmor)
    via commande système ou modification directe de /etc/selinux/config.
    Réduit significativement la posture de sécurité du système.

- id: rule_rootkit_detection
  name: "Chargement de module noyau (insmod/modprobe)"
  enabled: true
  # R-05 : sévérité abaissée de CRITICAL à HIGH — insmod/modprobe sont très courants
  # pour des modules légitimes (pilotes GPU, VirtualBox, VMware, Bluetooth…).
  # CRITICAL devrait être réservé à un second niveau avec détection de nom suspect.
  severity: high
  tags: [defense_evasion, rootkit]
  mitre: [T1014]
  platforms: [linux]
  condition: |
    event.category == "process"
    and (event.process_name == "insmod" or event.process_name == "modprobe")
    and event.uid == 0
    # R-05 : exclusions des modules légitimes courants pour réduire les faux positifs.
    and not(event.executable contains "depmod")
    and not(event.resource contains "nvidia")
    and not(event.resource contains "vboxdrv")
    and not(event.resource contains "vmw_")
    and not(event.resource contains "bluetooth")
  timeframe: null
  threshold: null
  actions: [ALERT, INVESTIGATE]
  explanation: >
    Chargement d'un module noyau par root (uid==0) via insmod ou modprobe.
    Vecteur d'installation de rootkit ou de backdoor kernel. La sévérité est HIGH
    (et non CRITICAL) car insmod/modprobe sont fréquemment utilisés pour des modules
    légitimes. Les modules nvidia, vboxdrv, vmw_* et bluetooth sont exclus pour
    limiter les faux positifs. Un second niveau de détection (nom de module inconnu
    ou pattern suspect) peut élever à CRITICAL.
