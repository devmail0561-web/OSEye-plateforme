- id: rule_ssh_lateral
  name: "Connexion SSH sortante vers réseau interne (lateral movement)"
  enabled: true
  severity: medium
  tags: [lateral_movement, ssh]
  mitre: [T1021.004]
  platforms: [linux]
  condition: |
    event.category == "network"
    and event.protocol == "tcp"
    and event.dst_port == 22
    and event.type == "new"
    and (event.dst_ip starts_with "10." or event.dst_ip starts_with "192.168."
         or event.dst_ip starts_with "172.16." or event.dst_ip starts_with "172.17."
         or event.dst_ip starts_with "172.18." or event.dst_ip starts_with "172.19."
         or event.dst_ip starts_with "172.20." or event.dst_ip starts_with "172.21."
         or event.dst_ip starts_with "172.22." or event.dst_ip starts_with "172.23."
         or event.dst_ip starts_with "172.24." or event.dst_ip starts_with "172.25."
         or event.dst_ip starts_with "172.26." or event.dst_ip starts_with "172.27."
         or event.dst_ip starts_with "172.28." or event.dst_ip starts_with "172.29."
         or event.dst_ip starts_with "172.30." or event.dst_ip starts_with "172.31.")
  timeframe: null
  threshold: null
  actions: [ALERT]
  explanation: >
    Connexion SSH sortante vers une adresse IP interne.
    Peut indiquer un mouvement latéral depuis une machine compromise vers d'autres cibles.

- id: rule_port_scan
  name: "Scan de ports (>100 connexions TCP new/30s, uid!=0)"
  enabled: true
  severity: high
  tags: [lateral_movement, discovery, port_scan]
  mitre: [T1046]
  platforms: [linux]
  # YAML-007: compte toutes les connexions TCP new, pas les IPs distinctes.
  known_limitation: "counts all TCP new connections, not distinct destination IPs"
  condition: |
    event.category == "network"
    and event.protocol == "tcp"
    and event.type == "new"
    and event.uid != 0
  timeframe: 30
  threshold: 20
  actions: [ALERT]
  explanation: >
    Plus de 20 connexions TCP new en 30 secondes depuis un utilisateur non-root.
    Pattern typique d'un scan de ports offensif (nmap, masscan).
    NOTE (YAML-007): compte toutes les connexions TCP new (pas nécessairement
    vers des IPs distinctes) — count_distinct non supporté nativement.

- id: rule_rsync_scp_large_transfer
  name: "Transfert de données volumineux via rsync/scp"
  enabled: true
  severity: medium
  tags: [lateral_movement, data_transfer]
  mitre: [T1021.004, T1048]
  platforms: [linux]
  condition: |
    event.category == "process"
    and (event.process_name == "rsync" or event.process_name == "scp")
    and event.uid != 0
  timeframe: 60
  threshold: 3
  actions: [ALERT]
  explanation: >
    Utilisation répétée de rsync ou scp (>3 invocations en 60s) par un utilisateur
    non-root. Peut indiquer une exfiltration de données. Aucun filtre horaire n'est
    appliqué — la règle se déclenche 24h/24 ; combiner avec les destinations réseau
    pour affiner le triage.

- id: rule_nfs_smb_mount_suspicious
  name: "Montage NFS/SMB suspect"
  enabled: true
  severity: medium
  tags: [lateral_movement, remote_services]
  mitre: [T1021.002]
  platforms: [linux]
  condition: |
    event.category == "process"
    and (event.process_name == "mount" or event.cmdline contains "mount")
    and (event.cmdline contains "cifs" or event.cmdline contains "nfs"
         or event.cmdline contains "smbfs")
  timeframe: null
  threshold: null
  actions: [ALERT]
  explanation: >
    Montage de partage réseau NFS/SMB (tout utilisateur, y compris root).
    Peut indiquer une reconnaissance ou un accès latéral à des ressources partagées.

- id: rule_rdp_tunneling
  name: "Tunnel RDP via SSH (port forwarding)"
  enabled: true
  severity: high
  tags: [lateral_movement, protocol_tunneling]
  mitre: [T1572]
  platforms: [linux]
  condition: |
    event.category == "process"
    and event.process_name == "ssh"
    and (event.cmdline contains "-L 3389" or event.cmdline contains "-R 3389"
         or event.cmdline contains "-D")
  timeframe: null
  threshold: null
  actions: [ALERT, INVESTIGATE]
  explanation: >
    Création d'un tunnel SSH vers le port RDP (3389) ou en mode SOCKS (-D).
    Technique de pivot réseau courante dans les intrusions avancées.
