- id: agent_shadow_read
  name: Shadow File Read Detected
  version: 1
  severity: critical
  autonomy: critical_only
  threshold: 0.7
  response: log
  confidence: 0.9
  conditions:
    - field: _source
      op: eq
      value: fanotify
      weight: 1.0
    - field: event_type
      op: in
      value:
        - open
        - access
      weight: 1.0
    - field: path
      op: eq
      value: /etc/shadow
      weight: 1.0

- id: agent_shadow_write
  name: Shadow File Write Detected
  version: 1
  severity: critical
  autonomy: critical_only
  threshold: 0.7
  response: quarantine_file
  confidence: 0.9
  conditions:
    - field: _source
      op: eq
      value: fanotify
      weight: 1.0
    - field: event_type
      op: eq
      value: close_write
      weight: 1.0
    - field: path
      op: eq
      value: /etc/shadow
      weight: 1.0

