[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oseye-sdk"
version = "0.1.0"
description = "OSEye Plugin SDK — base classes and IPC for third-party plugins"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["oseye", "edr", "siem", "plugin", "sdk"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["oseye_sdk"]

[project.urls]
Repository = "https://github.com/oseye/oseye"
