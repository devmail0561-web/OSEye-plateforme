<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSEye — Architecture & Flux de Données</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #161b27;
    --surface2: #1e2535;
    --border: #2a3349;
    --text: #e2e8f0;
    --muted: #7a8aaa;
    --accent: #4f8ef7;

    /* Categorical palette (validated order) */
    --c1: #4f8ef7;   /* blue   — Agent/Collectors */
    --c2: #3ecf8e;   /* green  — Event Bus */
    --c3: #f5a623;   /* amber  — Processing engines */
    --c4: #e25c6a;   /* red    — Alerts/Decisions */
    --c5: #a78bfa;   /* violet — Storage */
    --c6: #38bdf8;   /* sky    — API/UI */
    --c7: #fb923c;   /* orange — Threat Intel */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    padding: 14px 24px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  header .subtitle {
    color: var(--muted);
    font-size: 13px;
  }

  header .badge {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 11px;
    color: var(--muted);
  }

  .legend-bar {
    display: flex;
    flex-wrap: nowrap;
    gap: 14px;
    padding: 8px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }

  .legend-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .canvas-wrapper {
    padding: 16px 24px;
  }

  svg#flow {
    display: block;
    width: 100%;
    height: calc(100vh - 120px);
    background: var(--bg);
  }

  /* Node base */
  .node rect {
    rx: 7;
    stroke-width: 1.5;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.4));
    transition: filter .15s, opacity .15s;
  }
  .node:hover rect { filter: drop-shadow(0 4px 16px rgba(79,142,247,.35)); }
  .node text { pointer-events: none; }
  .node-title { font-size: 11px; font-weight: 600; fill: #e2e8f0; }
  .node-sub   { font-size: 9px; fill: #7a8aaa; }
  .node-badge { font-size: 9px;  fill: #4f8ef7; }

  /* Arrows */
  .flow-arrow {
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    marker-end: url(#arrowhead);
    opacity: .75;
    transition: opacity .15s, stroke-width .15s;
  }
  .flow-arrow:hover { opacity: 1; stroke-width: 2.5; }

  .flow-label {
    font-size: 9px;
    fill: var(--muted);
  }

  /* Section headers */
  .section-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    fill: #4a5875;
  }

  /* Status pills */
  .pill-done   { fill: #1a3a2a; stroke: #3ecf8e; }
  .pill-wip    { fill: #3a2e14; stroke: #f5a623; }
  .pill-todo   { fill: #2a2a3a; stroke: #555; }
  .pill-text-done { fill: #3ecf8e; }
  .pill-text-wip  { fill: #f5a623; }
  .pill-text-todo { fill: #555; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: #1e2535;
    border: 1px solid #2a3349;
    border-radius: 8px;
    padding: 10px 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .12s;
    max-width: 260px;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #tooltip.visible { opacity: 1; }
  #tooltip .tt-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  #tooltip .tt-line  { font-size: 11px; color: #7a8aaa; margin-bottom: 2px; }
  #tooltip .tt-tech  { font-size: 10px; color: #4f8ef7; margin-top: 6px; }

  /* Stats row */
  .stats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 8px 24px;
    flex-wrap: nowrap;
  }
  .stats .stat-value { font-size: 13px; font-weight: 600; }
  .stat-sep { color: #2a3349; font-size: 13px; }
</style>
</head>

const tip = document.getElementById('tooltip');
document.querySelectorAll('.node').forEach(node => {
  const id = node.getAttribute('data-id');
  if (!id || !tooltips[id]) return;
  node.style.cursor = 'pointer';
  node.addEventListener('mouseenter', e => {
    const d = tooltips[id];
    tip.innerHTML = `<div class="tt-title">${d.title}</div>`
      + d.lines.map(l => `<div class="tt-line">• ${l}</div>`).join('')
      + (d.tech ? `<div class="tt-tech">⚙ ${d.tech}</div>` : '');
    tip.classList.add('visible');
  });
  node.addEventListener('mousemove', e => {
    const x = e.clientX + 16, y = e.clientY + 8;
    tip.style.left = Math.min(x, window.innerWidth - 280) + 'px';
    tip.style.top  = Math.min(y, window.innerHeight - 200) + 'px';
  });
  node.addEventListener('mouseleave', () => tip.classList.remove('visible'));
});
